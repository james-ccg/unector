<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <!-- The SVG is the good one: sharp at any size, and it follows the
         browser's theme through a prefers-color-scheme rule inside the file.
         About 95% of browsers use it. Safari ignores it and falls back to
         the .ico, and iOS wants the touch icon for the home screen - without
         those two, that share of visitors gets no icon at all. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dispatch management for trucking companies, run through Telegram. Rate confirmations read from your inbox, load details posted to the driver's group, and a live dashboard." />
    <title>Freight Pilot - Dispatch Management</title>

    <!-- What Telegram, X, WhatsApp and the rest show when someone pastes a
         link. None of it is read from the rendered page: these crawlers do
         not run JavaScript, so everything has to be here in the HTML the
         server sends.

         og:image and og:url are written relative and rewritten to absolute
         per request by miniapp/api.py's serve_react_app - the host changes
         with every dev tunnel, and a hardcoded absolute URL would go stale
         the moment it did.

         twitter:card is what decides between a large image and a small
         square thumbnail. Telegram honours it, and without it the preview
         is a thumbnail no matter how large the image is. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Freight Pilot" />
    <meta property="og:title" content="Freight Pilot - Dispatch Management" />
    <meta property="og:description" content="Dispatch management for trucking companies, run through Telegram. Rate confirmations read from your inbox, load details posted to the driver's group, and a live dashboard." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Freight Pilot - dispatch management for trucking companies, run through Telegram" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Freight Pilot - Dispatch Management" />
    <meta name="twitter:description" content="Dispatch management for trucking companies, run through Telegram. Rate confirmations read from your inbox, load details posted to the driver's group, and a live dashboard." />
    <meta name="twitter:image" content="/og-image.png" />
    <script>
      // Applies the saved theme/font/motion prefs before React (or even the
      // CSS) loads, so there's no flash of the wrong appearance on first
      // paint. "default" (the font default) sets no attribute at all - the
      // brand face is already the token value. Reduce-motion has no
      // attribute-less default: with nothing stored yet, it falls back to
      // the OS accessibility setting, mirroring PreferencesContext's own
      // first-run logic. Storage access is wrapped because it throws
      // outright in a private window or with site data blocked - the page
      // must still render, just without the saved preferences.
      (function () {
        function stored(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }

        var theme = stored('fp-theme');
        if (theme !== 'light' && theme !== 'dark' && theme !== 'system') {
          theme = 'system';
        }
        // "system"/Auto mirrors ThemeContext.tsx's resolveTheme(): follow
        // the device, and nothing else. Keep the two in step - if they ever
        // resolve differently, the page paints one theme and React then
        // corrects it, which is a visible flash.
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);

        var font = stored('fp-font');
        if (font === 'system' || font === 'serif') {
          document.documentElement.setAttribute('data-font', font);
        }

        var reduceMotion = stored('fp-reduce-motion');
        if (reduceMotion === null) {
          reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'true' : 'false';
        }
        document.documentElement.setAttribute('data-reduce-motion', reduceMotion);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
