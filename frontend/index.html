<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Freight Pilot - Telegram bot for trucking dispatch management" />
    <title>Freight Pilot - Dispatch Management</title>
    <script>
      // Applies the saved theme/font-size/motion prefs before React (or even
      // the CSS) loads, so there's no flash of the wrong appearance on first
      // paint. "medium" (the font-size default) sets no attribute at all -
      // the implicit 1x zoom handles that case on its own. Reduce-motion has
      // no attribute-less default: with nothing stored yet, it falls back to
      // the OS accessibility setting, mirroring PreferencesContext's own
      // first-run logic.
      (function () {
        var theme = localStorage.getItem('fp-theme');
        if (theme !== 'light' && theme !== 'dark' && theme !== 'system') {
          theme = 'system';
        }
        // "system"/Auto mirrors ThemeContext.tsx's resolveTheme(): the
        // device's own preference wins whenever it actively says dark;
        // otherwise it falls back to a simple night-hours-are-dark rule
        // (matching device-says-light-but-it's-late, or no media query
        // support at all) rather than defaulting to light either way.
        if (theme === 'system') {
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var hour = new Date().getHours();
          var isNight = hour >= 19 || hour < 7;
          theme = prefersDark || isNight ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);

        var fontSize = localStorage.getItem('fp-font-size');
        if (fontSize === 'small' || fontSize === 'large') {
          document.documentElement.setAttribute('data-font-size', fontSize);
        }

        var reduceMotion = localStorage.getItem('fp-reduce-motion');
        if (reduceMotion === null) {
          reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'true' : 'false';
        }
        document.documentElement.setAttribute('data-reduce-motion', reduceMotion);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
