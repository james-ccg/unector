<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Freight Pilot - Telegram bot for trucking dispatch management" />
    <title>Freight Pilot - Dispatch Management</title>
    <script>
      // Applies the saved theme/font/motion prefs before React (or even the
      // CSS) loads, so there's no flash of the wrong appearance on first
      // paint. "default" (the font default) sets no attribute at all - the
      // brand face is already the token value. Reduce-motion has no
      // attribute-less default: with nothing stored yet, it falls back to
      // the OS accessibility setting, mirroring PreferencesContext's own
      // first-run logic. Storage access is wrapped because it throws
      // outright in a private window or with site data blocked - the page
      // must still render, just without the saved preferences.
      (function () {
        function stored(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }

        var theme = stored('fp-theme');
        if (theme !== 'light' && theme !== 'dark' && theme !== 'system') {
          theme = 'system';
        }
        // "system"/Auto mirrors ThemeContext.tsx's resolveTheme(): follow
        // the device, and nothing else. Keep the two in step - if they ever
        // resolve differently, the page paints one theme and React then
        // corrects it, which is a visible flash.
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);

        var font = stored('fp-font');
        if (font === 'system' || font === 'serif') {
          document.documentElement.setAttribute('data-font', font);
        }

        var reduceMotion = stored('fp-reduce-motion');
        if (reduceMotion === null) {
          reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'true' : 'false';
        }
        document.documentElement.setAttribute('data-reduce-motion', reduceMotion);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
