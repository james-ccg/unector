# Tests and dependency scanning on every push and pull request.
#
# Version bumps used to arrive on their own, but nothing ran against
# them: a bump could be merged without the suite ever executing, and a
# newly-disclosed advisory in a pinned dependency went unnoticed until
# someone happened to look. The audit jobs are the standing check; the
# bumps themselves are now made by hand, from what those jobs report.
name: CI

on:
  push:
    # main only. Work happens on dednod and is fast-forwarded into main, so
    # both branches carry the identical commit - listing both ran every job
    # twice over the same code and doubled the minutes for nothing.
    branches: [main]
  pull_request:
  # Run it deliberately, from the Actions tab.
  workflow_dispatch:
  schedule:
    # Monday morning. Advisories are published against code that has not
    # changed, so a dependency that was clean at the last commit can be
    # vulnerable a week later with nothing to trigger a check. On a public
    # repository these minutes are billed at zero, and the jobs only read -
    # they run the tests, query the advisory databases, and scan this
    # repository's own history.
    - cron: '0 6 * * 1'

permissions:
  contents: read

# A newer push makes an in-flight run redundant. Without this they queue up
# and all of them finish, which costs minutes to learn something already
# superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: Frontend types, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint src/
      - run: npm run build

  audit-python:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt -r requirements-dev.txt --strict

  audit-npm:
    name: npm dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Moderate and above. Low-severity advisories in dev-only tooling are
      # not worth blocking a merge on, and a check that cries wolf gets
      # ignored, which costs more than it saves.
      - run: npm audit --audit-level=moderate

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a key committed and then removed is still a
          # published key, and a shallow clone would not see it.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
